# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

# -- Basic Settings ------------------------------------------
set -g prefix M-Space
set -g escape-time 500
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g mouse on

# -- Key Bindings ------------------------------------------
# Treat Shift+Space like a normal space inside panes.
bind -n S-Space send-keys Space

# Ghostty sends Ctrl+Backspace as ESC DEL (Meta+Backspace).
# Convert it to Ctrl+w only in Neovim so the leading ESC does not exit insert mode.
bind -n M-BSpace if-shell -F '#{m/r:^[gn]?vim$,#{pane_current_command}}' 'send-keys C-w' 'send-keys M-BSpace'

# Forward Shift+Enter so terminal apps can handle it distinctly from Enter.
bind -n S-Enter send-keys S-Enter

# Window management
bind T new-window
bind r command-prompt -I "#W" "rename-window '%%'"
bind R command-prompt -I "#W" "rename-session '%%'"
bind q confirm-before -p "kill-window #W? (y/n)" kill-window

# Pane management
bind t split-window -h
bind g split-window -v
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Copy mode
bind-key -T copy-mode-vi v send -X begin-selection

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-left "#{session_name} "
set -g status-left-length 50
set -g status-right "#{host} %Y-%m-%d %H:%M"
set -g status-right-length 50

# -- Plugins -----------------------------------------------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Theme
set -g @plugin 'odedlaz/tmux-onedark-theme'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
